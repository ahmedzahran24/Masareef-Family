name: Extract Beitna Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP safely
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          archive = Path("beitna_expenses_source.zip")
          root = Path.cwd().resolve()

          if not archive.is_file():
              raise SystemExit("ZIP file not found")

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (root / item.filename).resolve()
                  if not target.is_relative_to(root):
                      raise SystemExit("Unsafe ZIP path")
                  if item.is_dir():
                      continue
                  mode = (item.external_attr >> 16) & 0o170000
                  if mode == 0o120000:
                      raise SystemExit("Symlinks are not allowed")
                  if target == root / archive.name:
                      raise SystemExit("ZIP cannot overwrite itself")
              z.extractall(root)

          print("Project extracted successfully")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new files"
          else
            git commit -m "Extract Beitna application source"
            git push
          fi
